version: 2
updates:
  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ready-for-agent"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Maintain Bun / NPM packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ready-for-agent"
    commit-message:
      prefix: "chore"
      include: "scope"
